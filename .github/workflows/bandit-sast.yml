name: SAST - Bandit

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  bandit:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install bandit bandit-to-sarif

      - name: Run Bandit Scan and Convert to SARIF
        run: |
          # Run Bandit and output JSON
          bandit -r . -c .bandit -f json -o bandit-results.json
          
          # Convert JSON to SARIF
          bandit-to-sarif -i bandit-results.json -o bandit-results.sarif

      - name: Upload SARIF report
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit-results.sarif
